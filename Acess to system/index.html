<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
    <title>Document</title>
</head>
<body>
    <div class="full-container">
        <div class="title-container">
            <h1 id="title">Access To System</h1>
        </div>
        <div class="password-container">
            <input type="text" placeholder="Enter password" id="password">
            <button type="submit" aria-placeholder="Enter" id="submitPassword">Enter</button>
        </div>
        <div class="message-container">
            <p id="displayMessage"></p>
        </div>
    </div>
    <div class="images">
        <div id="lockImage">
            <img src="images/lock.png" alt="Image of a lock">
        </div>
        <div id="checkMarkImage">
            <img src="images/check.png" alt="Image of a check mark">
        </div>
    </div>
</body>
</html>
